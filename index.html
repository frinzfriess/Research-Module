<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Research Tutor Light Website Deck</title>
<style>
:root{--bg:#f5f7fb;--panel:#ffffff;--line:#d8e0eb;--text:#102033;--muted:#64748b;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--pink:#e11d48;--violet:#7c3aed;--soft:#f8fafc;}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f8fbff,#eef4ff);color:var(--text)}
.appbar{height:72px;position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);box-shadow:0 8px 25px rgba(15,23,42,.08)}
.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#38bdf8,#2563eb,#7c3aed);color:white;font-weight:950}.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}
.tools{display:flex;gap:10px;align-items:center}.tools input{width:300px;max-width:28vw;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text);outline:none}button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}button:hover{background:#eff6ff}
.shell{height:100%;padding-top:72px;display:grid;grid-template-columns:310px 1fr 270px}.sidebar,.notes{height:calc(100vh - 72px);overflow:auto;padding:18px;background:#ffffff;border-right:1px solid var(--line)}.notes{border-left:1px solid var(--line);border-right:0}
.tocBtn{width:100%;display:flex;gap:8px;text-align:left;margin:4px 0;padding:9px 10px;border:0;border-radius:12px;background:transparent;color:#334155;font-size:13px}.tocBtn.active,.tocBtn:hover{background:#dbeafe;color:#1e40af}.tocNum{min-width:25px;height:25px;border-radius:8px;background:#eef2ff;color:#1d4ed8;display:grid;place-items:center;font-size:11px;font-weight:900}
.stageWrap{height:calc(100vh - 72px);padding:22px;display:flex;flex-direction:column;gap:12px}.stage{flex:1;position:relative;border:1px solid var(--line);border-radius:34px;background:#ffffff;box-shadow:0 28px 90px rgba(15,23,42,.12);overflow:hidden}.slideHeader{position:absolute;top:0;left:0;right:0;height:58px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;background:#f8fafc;border-bottom:1px solid var(--line)}.slideContent{position:absolute;top:58px;bottom:70px;left:0;right:0;padding:30px 40px;overflow:auto}.slideFooter{position:absolute;bottom:0;left:0;right:0;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-top:1px solid var(--line);background:#f8fafc}
.kicker{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#1e40af;background:#dbeafe;border-radius:999px;padding:6px 10px}h1.slideTitle{font-size:40px;line-height:1.05;margin:0 0 10px}.subtitle{font-size:18px;color:#475569;margin-bottom:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.triple{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.heroCards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.heroCards div,.panel,.example,.lessonBlock,.exampleBox,.pdfCard,.callout{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 20px rgba(15,23,42,.06)}.heroCards b{display:block;color:var(--muted)}.heroCards span{font-size:24px;font-weight:950}.good{border-left:7px solid var(--green)}.bad{border-left:7px solid var(--pink)}.tip{border-left:7px solid var(--amber)}.example{border-left:7px solid var(--violet)}.callout{border-left:7px solid var(--blue);background:#eff6ff}.diagram{display:flex;gap:10px;align-items:center;margin:16px 0}.diagram div{flex:1;text-align:center;background:#eff6ff;border:1px solid #bfdbfe;border-radius:18px;padding:14px;font-weight:900}.diagram span{font-size:30px;color:#2563eb}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}th{background:#dbeafe;text-align:left;color:#0f172a}td,th{border:1px solid #cbd5e1;padding:9px;vertical-align:top}td{background:#ffffff;color:#334155}.compareTable th:first-child{background:#dcfce7}.compareTable th:last-child{background:#fef3c7}.sampleText{font-size:14px;columns:2;column-gap:24px}.sampleText h3{font-size:17px;color:#1e40af;margin:0 0 6px;break-after:avoid}.fullSample{columns:1;font-size:14px;max-width:1040px;margin:auto}.chart{height:160px;display:flex;align-items:flex-end;gap:16px;border-left:2px solid #94a3b8;border-bottom:2px solid #94a3b8;padding:10px 20px;margin:14px 0;background:#f8fafc;border-radius:16px}.chart div{position:relative;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;color:white;font-weight:900;font-size:12px}.pdfCard a{display:inline-block;margin-top:8px;color:white;background:linear-gradient(135deg,#2563eb,#7c3aed);padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:900}iframe{width:100%;height:420px;border:1px solid var(--line);border-radius:20px;margin-top:16px}.progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#2563eb,#7c3aed)}.notesBox{background:#ffffff;border:1px solid var(--line);border-radius:20px;padding:14px;color:#334155;box-shadow:0 8px 20px rgba(15,23,42,.06)}.meta{font-size:13px;color:var(--muted)}.frameworkDiagram{display:flex;flex-direction:column;align-items:center;gap:12px;margin:18px 0}.theoryBox{background:#eff6ff;border:1px solid #93c5fd;border-radius:18px;padding:14px 18px;text-align:center;font-weight:900;min-width:240px}.theoryBox small{display:block;font-weight:500;color:#475569;margin-top:4px}.theoryBox.main{background:#ede9fe;border-color:#c4b5fd}.theoryBox.output{background:#fef3c7;border-color:#fcd34d}.branchRow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.arrowDown{font-size:28px;color:#2563eb;font-weight:900}.ipoAdvanced{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr;gap:12px;align-items:stretch;margin:18px 0}.ipoCol{border-radius:22px;padding:16px;border:1px solid #cbd5e1}.ipoCol h3{text-align:center;margin-top:0}.ipoCol.input{background:#eff6ff}.ipoCol.process{background:#f0fdf4}.ipoCol.output{background:#fffbeb}.bigArrow{display:flex;align-items:center;justify-content:center;font-size:34px;color:#2563eb;font-weight:900}.compact{grid-template-columns:1fr 30px 1fr 30px 1fr}
@media(max-width:1100px){.shell{grid-template-columns:1fr}.sidebar,.notes{display:none}.tools input{display:none}.grid2,.triple,.heroCards{grid-template-columns:1fr}.ipoAdvanced{grid-template-columns:1fr}.bigArrow{transform:rotate(90deg)}}@media print{html,body{overflow:auto;background:white;color:black}.appbar,.sidebar,.notes,.slideFooter{display:none}.shell{display:block;padding:0}.stageWrap{height:auto;padding:0}.stage{height:100vh;page-break-after:always;border:0;border-radius:0;box-shadow:none;background:white;color:black}.slideContent{bottom:0;color:black}}

.paperMock{background:#ffffff;border:1px solid #d8e0eb;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 20px rgba(15,23,42,.06)}
.paperMock h3{margin-top:0;color:#1e40af}
.paperMock p{line-height:1.6}


/* ---------- Tablet and Phone Optimization ---------- */
.menuBtn{display:none}
.mobileBackdrop{display:none}

@media(max-width:1180px){
  html,body{
    overflow:hidden;
    height:100%;
  }

  .appbar{
    height:66px;
    padding:0 12px;
  }

  .brand{
    min-width:0;
  }

  .brand h1{
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:44vw;
  }

  .brand small{
    display:none;
  }

  .logo{
    width:40px;
    height:40px;
    border-radius:14px;
    flex:0 0 auto;
  }

  .tools{
    gap:6px;
  }

  .tools input{
    display:none;
  }

  .menuBtn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .shell{
    display:block;
    padding-top:66px;
    height:100%;
  }

  .sidebar{
    display:block;
    position:fixed;
    top:66px;
    left:0;
    bottom:0;
    width:min(86vw,340px);
    height:calc(100vh - 66px);
    z-index:30;
    transform:translateX(-105%);
    transition:transform .25s ease;
    box-shadow:18px 0 50px rgba(15,23,42,.22);
  }

  body.menuOpen .sidebar{
    transform:translateX(0);
  }

  .mobileBackdrop{
    display:none;
    position:fixed;
    inset:66px 0 0 0;
    background:rgba(15,23,42,.35);
    z-index:25;
  }

  body.menuOpen .mobileBackdrop{
    display:block;
  }

  .notes{
    display:none;
  }

  .stageWrap{
    height:calc(100vh - 66px);
    padding:10px;
  }

  .stage{
    border-radius:22px;
    height:100%;
  }

  .slideHeader{
    height:50px;
    padding:0 14px;
  }

  .kicker{
    font-size:10px;
    max-width:65vw;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .meta{
    font-size:11px;
  }

  .slideContent{
    top:50px;
    bottom:64px;
    padding:18px;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
  }

  .slideFooter{
    height:64px;
    padding:0 12px;
    gap:8px;
  }

  .slideFooter > div:last-child{
    display:flex;
    gap:6px;
  }

  .slideFooter button{
    padding:9px 11px;
    font-size:13px;
  }

  h1.slideTitle{
    font-size:28px;
    line-height:1.12;
  }

  .subtitle{
    font-size:15px;
    margin-bottom:12px;
  }

  .grid2,
  .triple,
  .heroCards{
    grid-template-columns:1fr;
  }

  .heroCards{
    gap:10px;
    margin:14px 0;
  }

  .heroCards span{
    font-size:19px;
  }

  .panel,.example,.lessonBlock,.exampleBox,.pdfCard,.callout,.paperMock{
    padding:13px;
    border-radius:16px;
  }

  .diagram{
    flex-direction:column;
    align-items:stretch;
    gap:6px;
  }

  .diagram span{
    transform:rotate(90deg);
    align-self:center;
    font-size:22px;
  }

  .diagram div{
    padding:11px;
  }

  table{
    display:block;
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    white-space:normal;
    font-size:12px;
  }

  th,td{
    min-width:130px;
    padding:8px;
  }

  .compareTable th,.compareTable td{
    min-width:220px;
  }

  .sampleText,
  .fullSample{
    columns:1;
    font-size:13px;
    max-width:100%;
  }

  .sampleText h3{
    font-size:15px;
  }

  .frameworkDiagram{
    gap:8px;
  }

  .branchRow{
    flex-direction:column;
    width:100%;
  }

  .theoryBox{
    min-width:0;
    width:100%;
    padding:12px;
  }

  .ipoAdvanced,
  .compact{
    grid-template-columns:1fr;
    gap:8px;
  }

  .bigArrow{
    transform:rotate(90deg);
    font-size:24px;
    min-height:22px;
  }

  .chart{
    height:140px;
    overflow-x:auto;
    min-width:0;
    gap:10px;
    padding:10px;
  }

  .chart div{
    min-width:52px;
  }

  iframe{
    height:60vh;
    min-height:360px;
  }
}

@media(max-width:600px){
  .appbar{
    height:62px;
    padding:0 8px;
  }

  .logo{
    width:36px;
    height:36px;
    border-radius:12px;
    font-size:13px;
  }

  .brand h1{
    font-size:13px;
    max-width:38vw;
  }

  button{
    padding:8px 10px;
    font-size:12px;
  }

  .shell{
    padding-top:62px;
  }

  .sidebar{
    top:62px;
    height:calc(100vh - 62px);
    width:88vw;
  }

  .mobileBackdrop{
    inset:62px 0 0 0;
  }

  .stageWrap{
    height:calc(100vh - 62px);
    padding:7px;
  }

  .stage{
    border-radius:18px;
  }

  .slideHeader{
    height:46px;
    padding:0 10px;
  }

  .slideContent{
    top:46px;
    bottom:58px;
    padding:14px;
  }

  .slideFooter{
    height:58px;
    padding:0 9px;
  }

  .progress{
    height:7px;
    min-width:78px;
  }

  h1.slideTitle{
    font-size:24px;
  }

  .subtitle{
    font-size:14px;
  }

  p,li{
    font-size:13px;
    line-height:1.55;
  }

  .tocBtn{
    font-size:12px;
    padding:9px;
  }

  .tocNum{
    min-width:23px;
    height:23px;
  }

  th,td{
    min-width:120px;
    font-size:11.5px;
  }

  .paperMock{
    margin:10px 0;
  }

  iframe{
    height:55vh;
    min-height:310px;
  }
}

@media(orientation:landscape) and (max-height:560px){
  .appbar{
    height:56px;
  }

  .shell{
    padding-top:56px;
  }

  .sidebar{
    top:56px;
    height:calc(100vh - 56px);
  }

  .stageWrap{
    height:calc(100vh - 56px);
  }

  .slideHeader{
    height:42px;
  }

  .slideContent{
    top:42px;
    bottom:54px;
    padding:12px 16px;
  }

  .slideFooter{
    height:54px;
  }

  h1.slideTitle{
    font-size:24px;
  }
}

</style></head>
<body>
<header class="appbar"><div class="brand"><div class="logo">RT</div><div><h1>Research Tutor Light</h1><small>Parts first, full sample after each chapter</small></div></div><div class="tools"><button id="menuToggle" class="menuBtn" onclick="toggleMenu()">☰ Menu</button><input id="search" placeholder="Search lesson..." /><button onclick="print()">Print</button><button onclick="go(0)">Start</button></div></header>
<div id="mobileBackdrop" class="mobileBackdrop" onclick="closeMenu()"></div><div class="shell"><aside class="sidebar"><h2>Slides</h2><div id="toc"></div></aside><main class="stageWrap"><div class="stage"><div class="slideHeader"><span class="kicker" id="section"></span><span class="meta" id="counter"></span></div><div class="slideContent"><h1 class="slideTitle" id="title"></h1><div class="subtitle" id="subtitle"></div><div id="body"></div></div><div class="slideFooter"><div class="progress"><div class="bar" id="bar"></div></div><div><button onclick="prev()">← Prev</button> <button onclick="next()">Next →</button></div></div></div></main><aside class="notes"><h2>Tutor Notes</h2><div class="notesBox" id="notes"></div><div class="notesBox" style="margin-top:12px"><b>Controls</b><br>Use ← and → keys, search, or sidebar.</div></aside></div>
<script>
const slides=[{"section": "Start", "title": "Research Tutor Website Deck", "subtitle": "White tutor-friendly deck with complete part lessons and full samples after each chapter", "body": "\n<div class=\"heroCards\">\n  <div><b>Mode</b><span>Website Deck</span></div>\n  <div><b>Theme</b><span>White Tutor</span></div>\n  <div><b>Structure</b><span>Parts \u2192 Sample</span></div>\n</div>\n<p>This website teaches research like a presentation deck. Each chapter includes an overview, every important part, quantitative and qualitative differences, clear examples, do\u2019s and don\u2019ts, tutor tips, diagrams, tables, and then a complete full chapter sample at the end of that chapter.</p>\n<div class=\"callout\"><b>Important structure:</b> Chapter overview \u2192 each part of the chapter \u2192 full sample chapter \u2192 next chapter.</div>\n", "notes": "Tell the learner that every chapter will be taught part-by-part before showing the complete sample."}, {"section": "Before Chapters", "title": "Complete Research Paper Format", "subtitle": "What comes before and after Chapters 1\u20135", "body": "\n<table>\n<tr><th>Part</th><th>What It Contains</th><th>Purpose</th></tr>\n<tr><td>Title Page</td><td>Title, school, course/requirement, researchers, date.</td><td>Identifies the study formally.</td></tr>\n<tr><td>Approval Sheet</td><td>Adviser, panel, chair, signatures.</td><td>Shows official approval.</td></tr>\n<tr><td>Acknowledgement</td><td>People who helped the researchers.</td><td>Gives formal thanks.</td></tr>\n<tr><td>Abstract</td><td>Purpose, method, findings, conclusion, recommendation.</td><td>Summarizes the whole study.</td></tr>\n<tr><td>Table of Contents</td><td>Chapter and section list with pages.</td><td>Helps readers locate sections.</td></tr>\n<tr><td>Chapter 1</td><td>Problem and background.</td><td>Explains why the study is needed.</td></tr>\n<tr><td>Chapter 2</td><td>Literature, studies, theory, framework, gap.</td><td>Shows academic support.</td></tr>\n<tr><td>Chapter 3</td><td>Research methodology.</td><td>Explains how data will be gathered and analyzed.</td></tr>\n<tr><td>Chapter 4</td><td>Presentation, analysis, interpretation.</td><td>Shows and explains findings.</td></tr>\n<tr><td>Chapter 5</td><td>Summary, conclusions, recommendations.</td><td>Gives final answers and actions.</td></tr>\n<tr><td>References</td><td>All cited sources.</td><td>Credits sources and avoids plagiarism.</td></tr>\n<tr><td>Appendices</td><td>Letters, instruments, validation forms, screenshots, computations.</td><td>Supports the research.</td></tr>\n<tr><td>Curriculum Vitae</td><td>Researcher profile.</td><td>Shows researcher background.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Follow the school template first.</li><li>Keep headings consistent.</li><li>Update page numbers after final editing.</li><li>Use formal academic wording.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not mix formats from different schools.</li><li>Do not include uncited references.</li><li>Do not forget appendices for instruments and permission letters.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Show the full paper map before teaching Chapter 1 so students know where each part belongs.</li></ul></div>\n</div>\n", "notes": "Use this as the first orientation slide before chapter writing."}, {"section": "Before Chapters", "title": "Recommended Manuscript Formatting", "subtitle": "Common formatting guide used in many schools", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Basic Page Format</h3>\n<ul>\n<li>Paper size: A4</li>\n<li>Margins: commonly 1 inch or school-required margins</li>\n<li>Orientation: portrait</li>\n<li>Page number: follow school format</li>\n</ul></div>\n<div class=\"panel\"><h3>Text Format</h3>\n<ul>\n<li>Font: Arial or Times New Roman, depending on school</li>\n<li>Font size: usually 12 pt</li>\n<li>Line spacing: 1.5 or double spacing, depending on manual</li>\n<li>Alignment: justified for paragraphs</li>\n</ul></div>\n</div>\n<div class=\"callout\"><b>Reminder:</b> School instructions always come first. This website gives a general guide, but advisers may require a specific format.</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Use the same font throughout.</li><li>Label tables and figures properly.</li><li>Use clear section headings.</li><li>Proofread spacing and indentation.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not use random font sizes.</li><li>Do not decorate the manuscript like a poster.</li><li>Do not submit without checking adviser format.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Let the learner format one page first before writing the full paper.</li></ul></div>\n</div>\n", "notes": "Formatting should be taught before content writing."}, {"section": "Preliminary Paper", "title": "Preliminary and Back Matter Overview", "subtitle": "How to prepare the paper from Title Page to Curriculum Vitae", "body": "\n<p>Before Chapter 1 begins, a research manuscript usually has preliminary pages. After Chapter 5, it also has back matter such as references, appendices, and curriculum vitae. These parts make the paper complete and formal.</p>\n<table>\n<tr><th>Order</th><th>Part</th><th>Purpose</th></tr>\n<tr><td>1</td><td>Title Page</td><td>Officially identifies the research title, school, researchers, and date.</td></tr>\n<tr><td>2</td><td>Approval Sheet</td><td>Shows that the adviser, panel, or department accepted the study.</td></tr>\n<tr><td>3</td><td>Acknowledgement</td><td>Thanks the people and groups who helped complete the research.</td></tr>\n<tr><td>4</td><td>Dedication</td><td>Optional page dedicating the work to important people or groups.</td></tr>\n<tr><td>5</td><td>Abstract</td><td>Short complete summary of the whole research.</td></tr>\n<tr><td>6</td><td>Table of Contents</td><td>Lists chapters and sections with page numbers.</td></tr>\n<tr><td>7</td><td>List of Tables</td><td>Lists all tables used in the study.</td></tr>\n<tr><td>8</td><td>List of Figures</td><td>Lists all diagrams, graphs, frameworks, or images used.</td></tr>\n<tr><td>9</td><td>Chapters 1\u20135</td><td>Main body of the research paper.</td></tr>\n<tr><td>10</td><td>References</td><td>Complete list of cited sources.</td></tr>\n<tr><td>11</td><td>Appendices</td><td>Supporting documents such as letters, instruments, screenshots, and computations.</td></tr>\n<tr><td>12</td><td>Curriculum Vitae</td><td>Brief academic profile of the researchers.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Follow the exact order required by the school.</li><li>Use formal and clean formatting.</li><li>Update page numbers after final editing.</li><li>Keep the preliminary pages simple and professional.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not design preliminary pages like posters.</li><li>Do not add unnecessary images unless required.</li><li>Do not write the abstract before finishing the study.</li><li>Do not include uncited sources in references.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Teach this as the front door and closing folder of the research paper.</li><li>Let learners identify which parts come before Chapter 1 and which parts come after Chapter 5.</li></ul></div>\n</div>\n", "notes": "Use this slide to show the whole manuscript order."}, {"section": "Preliminary Paper", "title": "How to Create the Title Page", "subtitle": "First formal page of the research paper", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The title page is the first formal page of the research paper. It presents the research title, institution, purpose statement, names of researchers, and date of submission.</p></div>\n<div class=\"panel\"><h3>Purpose</h3><p>It identifies the study and shows that the paper is an academic requirement. It should be clean, centered, and formal.</p></div>\n</div>\n<table>\n<tr><th>Part</th><th>What to Put</th><th>Example</th></tr>\n<tr><td>Research Title</td><td>Complete title in uppercase or title case, depending on school format.</td><td>LEVEL OF USABILITY OF A WEB-BASED CONSULTATION SYSTEM AMONG COLLEGE STUDENTS AND FACULTY MEMBERS</td></tr>\n<tr><td>Presentation Line</td><td>Statement showing where the paper is submitted.</td><td>A Research Paper Presented to the Faculty of ABC College</td></tr>\n<tr><td>Requirement Line</td><td>Reason for submitting the paper.</td><td>In Partial Fulfillment of the Requirements for Practical Research</td></tr>\n<tr><td>Researchers</td><td>Complete names of group members.</td><td>Juan D. Santos, Maria L. Reyes, Carlo P. Cruz</td></tr>\n<tr><td>Date</td><td>Month and year of submission.</td><td>May 2026</td></tr>\n</table>\n<div class=\"paperMock\">\n<h3>Sample Title Page Layout</h3>\n<p><b>LEVEL OF USABILITY OF A WEB-BASED CONSULTATION SYSTEM AMONG COLLEGE STUDENTS AND FACULTY MEMBERS</b></p>\n<br>\n<p>A Research Paper Presented to the Faculty of ABC College</p>\n<p>In Partial Fulfillment of the Requirements for Practical Research</p>\n<br>\n<p>By:<br>Juan D. Santos<br>Maria L. Reyes<br>Carlo P. Cruz</p>\n<br>\n<p>May 2026</p>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Center the title page content.</li><li>Use the exact title approved by the adviser.</li><li>Write complete names of researchers.</li><li>Keep spacing clean and balanced.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not add decorative borders unless required.</li><li>Do not use nicknames.</li><li>Do not use a different title from the approved title.</li><li>Do not overcrowd the page.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Have learners check whether the title contains topic, focus, respondents, and locale if applicable.</li></ul></div>\n</div>\n", "notes": "Title page should look formal and simple."}, {"section": "Preliminary Paper", "title": "How to Create the Approval Sheet", "subtitle": "Official acceptance page", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The approval sheet is a formal page that shows the paper has been reviewed and accepted by the adviser, panel members, or department officials.</p></div>\n<div class=\"panel\"><h3>Purpose</h3><p>It documents that the study passed the required review or defense process. The exact names and signature lines depend on the school format.</p></div>\n</div>\n<div class=\"paperMock\">\n<h3>Sample Approval Sheet Text</h3>\n<p>This research paper entitled <b>\u201cLevel of Usability of a Web-Based Consultation System among College Students and Faculty Members\u201d</b> prepared by Juan D. Santos, Maria L. Reyes, and Carlo P. Cruz has been examined and recommended for acceptance and approval as partial fulfillment of the requirements for Practical Research.</p>\n<br>\n<p>Adviser: ________________________________</p>\n<p>Panel Member: ____________________________</p>\n<p>Panel Member: ____________________________</p>\n<p>Department Chair: _________________________</p>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Use the school-provided approval sheet if available.</li><li>Write the full title exactly as approved.</li><li>Leave enough space for signatures.</li><li>Check adviser and panel names carefully.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not invent signatories.</li><li>Do not change the approval wording if the school provides a template.</li><li>Do not forget date lines if required.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Explain that this page is usually finalized after defense or approval.</li></ul></div>\n</div>\n", "notes": "Approval sheet varies by institution."}, {"section": "Preliminary Paper", "title": "How to Write the Acknowledgement", "subtitle": "Formal thank-you page", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The acknowledgement is the section where researchers thank people or groups who helped complete the study.</p></div>\n<div class=\"panel\"><h3>Purpose</h3><p>It recognizes support from the adviser, panel, respondents or participants, school, classmates, family, and others who contributed to the research.</p></div>\n</div>\n<div class=\"paperMock\">\n<h3>Sample Acknowledgement</h3>\n<p>The researchers sincerely express their gratitude to their research adviser for the guidance, comments, and support given throughout the study. The researchers also thank the panel members for their suggestions that helped improve the paper.</p>\n<p>Special thanks are given to the respondents who shared their time and honest answers during the data-gathering process. The researchers are also grateful to their families and classmates for their encouragement and assistance during the completion of this research.</p>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Use formal and respectful language.</li><li>Thank people who actually helped.</li><li>Keep it sincere but not too long.</li><li>Mention adviser, panel, respondents, and family when appropriate.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not use slang or jokes.</li><li>Do not make it too emotional or overly personal.</li><li>Do not include unrelated people.</li><li>Do not write it like a social media post.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>A good acknowledgement is usually 2\u20134 paragraphs only.</li></ul></div>\n</div>\n", "notes": "Make it respectful and concise."}, {"section": "Preliminary Paper", "title": "How to Write the Dedication", "subtitle": "Optional personal dedication page", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The dedication is an optional page where researchers dedicate the work to people, groups, or values that inspired them.</p></div>\n<div class=\"panel\"><h3>Purpose</h3><p>It gives a short personal note before the main research paper. Some schools include it, while others skip it.</p></div>\n</div>\n<div class=\"paperMock\">\n<h3>Sample Dedication</h3>\n<p>This research is dedicated to the researchers\u2019 families, whose support and encouragement gave them strength throughout the completion of this study. It is also dedicated to the students and teachers who continue to value learning, guidance, and academic improvement.</p>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Keep it short.</li><li>Use respectful wording.</li><li>Check if the school requires or allows a dedication page.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not make it too dramatic.</li><li>Do not include private or inappropriate details.</li><li>Do not make it longer than the acknowledgement.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>If the adviser does not require it, this page may be omitted.</li></ul></div>\n</div>\n", "notes": "Dedication is optional in many formats."}, {"section": "Preliminary Paper", "title": "How to Write the Abstract", "subtitle": "Short summary of the whole research", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The abstract is a brief but complete summary of the research. It usually includes the purpose, method, respondents or participants, instrument, analysis, findings, conclusion, and recommendation.</p></div>\n<div class=\"panel\"><h3>When to Write</h3><p>Write the abstract after finishing Chapters 1 to 5 because it summarizes the completed study.</p></div>\n</div>\n<table>\n<tr><th>Abstract Part</th><th>Question Answered</th><th>Example</th></tr>\n<tr><td>Purpose</td><td>What was the study about?</td><td>This study determined the usability level of a web-based consultation system.</td></tr>\n<tr><td>Method</td><td>How was it conducted?</td><td>It used descriptive quantitative design.</td></tr>\n<tr><td>Respondents / Participants</td><td>Who gave data?</td><td>Data were gathered from 140 students and faculty members.</td></tr>\n<tr><td>Instrument</td><td>What tool was used?</td><td>A validated questionnaire was used.</td></tr>\n<tr><td>Findings</td><td>What was found?</td><td>The system received a grand mean of 4.44, interpreted as Strongly Agree.</td></tr>\n<tr><td>Recommendation</td><td>What should be done?</td><td>The study recommends improving notification and calendar features.</td></tr>\n</table>\n<div class=\"paperMock\">\n<h3>Sample Abstract</h3>\n<p>This study determined the level of usability of a web-based consultation system among college students and faculty members. The study used descriptive quantitative research design. Data were gathered from 140 respondents using a validated Likert-scale questionnaire and were analyzed using frequency, percentage, weighted mean, standard deviation, and t-test. Results showed that the system obtained a grand mean of 4.44, interpreted as Strongly Agree. The findings indicate that the system is highly usable and acceptable. The study recommends improving notification visibility, adding calendar integration, and conducting wider user testing.</p>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write it after finishing the paper.</li><li>Include purpose, method, findings, and recommendation.</li><li>Keep it concise and complete.</li><li>Add keywords if required.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not include citations in the abstract unless required.</li><li>Do not add new information not found in the paper.</li><li>Do not make it too long.</li><li>Do not write it like an introduction.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask learners to summarize each chapter in one sentence, then combine those sentences into the abstract.</li></ul></div>\n</div>\n", "notes": "Abstract is often the hardest because it summarizes everything."}, {"section": "Preliminary Paper", "title": "How to Create the Table of Contents", "subtitle": "Navigation page of the research paper", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The Table of Contents lists the major parts of the paper and their page numbers.</p></div>\n<div class=\"panel\"><h3>Purpose</h3><p>It helps readers, advisers, and panelists locate chapters and sections quickly.</p></div>\n</div>\n<div class=\"paperMock\">\n<h3>Sample Table of Contents</h3>\n<table>\n<tr><th>Section</th><th>Page</th></tr>\n<tr><td>Title Page</td><td>i</td></tr>\n<tr><td>Approval Sheet</td><td>ii</td></tr>\n<tr><td>Acknowledgement</td><td>iii</td></tr>\n<tr><td>Abstract</td><td>iv</td></tr>\n<tr><td>Chapter 1 - The Problem and Its Background</td><td>1</td></tr>\n<tr><td>Chapter 2 - Review of Related Literature and Studies</td><td>10</td></tr>\n<tr><td>Chapter 3 - Research Methodology</td><td>25</td></tr>\n<tr><td>Chapter 4 - Presentation, Analysis, and Interpretation of Data</td><td>35</td></tr>\n<tr><td>Chapter 5 - Summary, Conclusions, and Recommendations</td><td>50</td></tr>\n<tr><td>References</td><td>58</td></tr>\n<tr><td>Appendices</td><td>61</td></tr>\n<tr><td>Curriculum Vitae</td><td>70</td></tr>\n</table>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Use automatic Table of Contents if using Word or Google Docs.</li><li>Update page numbers before submission.</li><li>Match section titles exactly with the paper headings.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not manually type page numbers too early.</li><li>Do not include sections that are not in the paper.</li><li>Do not use inconsistent chapter titles.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Teach learners to update the Table of Contents last.</li></ul></div>\n</div>\n", "notes": "TOC is usually finalized last."}, {"section": "Preliminary Paper", "title": "How to Create List of Tables and List of Figures", "subtitle": "For tables, graphs, diagrams, and frameworks", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>List of Tables</h3><p>This lists all tables used in the paper, such as respondent profile, statistical treatment, Likert interpretation, and result tables.</p></div>\n<div class=\"panel\"><h3>List of Figures</h3><p>This lists all figures used in the paper, such as IPO diagrams, theoretical framework diagrams, conceptual framework diagrams, graphs, and system screenshots.</p></div>\n</div>\n<div class=\"grid2\">\n<div class=\"paperMock\">\n<h3>Sample List of Tables</h3>\n<table>\n<tr><th>Table</th><th>Title</th><th>Page</th></tr>\n<tr><td>1</td><td>Respondent Profile</td><td>36</td></tr>\n<tr><td>2</td><td>Usability Assessment Results</td><td>38</td></tr>\n<tr><td>3</td><td>Test of Significant Difference</td><td>41</td></tr>\n</table>\n</div>\n<div class=\"paperMock\">\n<h3>Sample List of Figures</h3>\n<table>\n<tr><th>Figure</th><th>Title</th><th>Page</th></tr>\n<tr><td>1</td><td>Theoretical Framework</td><td>18</td></tr>\n<tr><td>2</td><td>Conceptual Framework</td><td>20</td></tr>\n<tr><td>3</td><td>Usability Mean Score Graph</td><td>39</td></tr>\n</table>\n</div>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Number tables and figures in order.</li><li>Use clear and descriptive titles.</li><li>Make sure page numbers are correct.</li><li>Use the same title in the list and in the chapter.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not call a table a figure.</li><li>Do not forget framework diagrams in the List of Figures.</li><li>Do not leave page numbers blank in the final copy.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask learners to identify whether each visual is a table or figure.</li></ul></div>\n</div>\n", "notes": "Lists of tables and figures are needed when the paper has many visuals."}, {"section": "Back Matter", "title": "How to Write References", "subtitle": "Sources used in the research paper", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The references section lists all sources cited in the paper. It allows readers to locate the sources and verifies that the researchers used proper academic support.</p></div>\n<div class=\"panel\"><h3>Common Format</h3><p>Many schools use APA 7th edition, but students must still follow the format required by their adviser or department.</p></div>\n</div>\n<div class=\"paperMock\">\n<h3>Sample APA-style References</h3>\n<p>Ala, A., & Chen, F. (2022). Appointment scheduling problem in complexity systems of healthcare services: A comprehensive review. <i>Journal of Healthcare Engineering, 2022</i>, Article 5819813.</p>\n<p>Creswell, J. W., & Creswell, J. D. (2023). <i>Research design: Qualitative, quantitative, and mixed methods approaches</i> (6th ed.). SAGE Publications.</p>\n<p>Braun, V., & Clarke, V. (2006). Using thematic analysis in psychology. <i>Qualitative Research in Psychology, 3</i>(2), 77\u2013101.</p>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Include only sources cited in the paper.</li><li>Arrange references alphabetically.</li><li>Use hanging indent if required.</li><li>Check punctuation and italics.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not list sources that were not cited.</li><li>Do not paste raw links only.</li><li>Do not mix APA, MLA, and random formats.</li><li>Do not forget author, year, title, and source details.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Teach learners to create references immediately after citing a source to avoid missing entries later.</li></ul></div>\n</div>\n", "notes": "References must match in-text citations."}, {"section": "Back Matter", "title": "How to Prepare Appendices", "subtitle": "Supporting documents after references", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Appendices contain supporting documents that are too long or too detailed to place in the main chapters.</p></div>\n<div class=\"panel\"><h3>Purpose</h3><p>They provide proof of procedures, instruments, permissions, validation, computations, or system documentation.</p></div>\n</div>\n<table>\n<tr><th>Appendix</th><th>Content</th><th>Example</th></tr>\n<tr><td>Appendix A</td><td>Permission Letter</td><td>Letter to conduct the study in the school.</td></tr>\n<tr><td>Appendix B</td><td>Research Instrument</td><td>Survey questionnaire or interview guide.</td></tr>\n<tr><td>Appendix C</td><td>Validation Forms</td><td>Expert validation sheets and comments.</td></tr>\n<tr><td>Appendix D</td><td>Data Support</td><td>Sample computation, coding matrix, or raw result summary.</td></tr>\n<tr><td>Appendix E</td><td>System/Output Support</td><td>Screenshots, interface mockups, ERD, flowcharts, or diagrams.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Label appendices clearly.</li><li>Refer to appendices in the main text if needed.</li><li>Put supporting documents in logical order.</li><li>Remove private information when necessary.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not place unrelated files in appendices.</li><li>Do not include confidential personal data.</li><li>Do not forget instrument and validation forms.</li><li>Do not leave appendices unlabeled.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Tell learners: appendices are evidence that the research process was actually done.</li></ul></div>\n</div>\n", "notes": "Appendices are proof and support."}, {"section": "Back Matter", "title": "How to Make the Curriculum Vitae", "subtitle": "Final researcher profile page", "body": "\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The Curriculum Vitae, or CV, is a short academic profile of the researcher. In many school research papers, it appears at the end of the manuscript.</p></div>\n<div class=\"panel\"><h3>Purpose</h3><p>It introduces the researcher\u2019s basic educational background, skills, and contact information in a formal way.</p></div>\n</div>\n<table>\n<tr><th>CV Part</th><th>What to Include</th></tr>\n<tr><td>Name</td><td>Complete name of the researcher.</td></tr>\n<tr><td>Address</td><td>General address or city/province, depending on school requirement.</td></tr>\n<tr><td>Email</td><td>Professional email address.</td></tr>\n<tr><td>Education</td><td>School, program, strand, course, or degree.</td></tr>\n<tr><td>Skills</td><td>Research writing, data gathering, documentation, analysis, presentation, programming, design, or other relevant skills.</td></tr>\n<tr><td>Achievements</td><td>Optional academic awards, certifications, or relevant activities.</td></tr>\n</table>\n<div class=\"paperMock\">\n<h3>Sample Curriculum Vitae</h3>\n<p><b>Juan D. Santos</b></p>\n<p>Address: Quezon City, Philippines</p>\n<p>Email: juan.santos@email.com</p>\n<p>Education: Bachelor of Science in Information Technology, ABC College</p>\n<p>Skills: Research writing, data gathering, system documentation, basic statistical analysis, interface testing, and oral presentation.</p>\n<p>Achievements: Completed capstone system evaluation and participated in academic research defense.</p>\n</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Use a professional email.</li><li>Keep details relevant to academic work.</li><li>Use complete name.</li><li>Follow the school\u2019s required CV format if given.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not include too much personal information.</li><li>Do not use informal descriptions.</li><li>Do not include fake achievements.</li><li>Do not include unnecessary hobbies unless required.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>For group research, each member may have a separate CV page depending on school requirements.</li></ul></div>\n</div>\n", "notes": "CV should be formal and short."}, {"section": "Preliminary Paper", "title": "Complete Preliminary-to-CV Checklist", "subtitle": "Use this before submitting the final manuscript", "body": "\n<table>\n<tr><th>Part</th><th>Check</th><th>Status</th></tr>\n<tr><td>Title Page</td><td>Correct title, school, researchers, date.</td><td>\u2610</td></tr>\n<tr><td>Approval Sheet</td><td>Correct signatories and signature lines.</td><td>\u2610</td></tr>\n<tr><td>Acknowledgement</td><td>Formal thanks to adviser, panel, respondents, and supporters.</td><td>\u2610</td></tr>\n<tr><td>Abstract</td><td>Purpose, method, findings, conclusion, recommendation.</td><td>\u2610</td></tr>\n<tr><td>Table of Contents</td><td>Updated section titles and page numbers.</td><td>\u2610</td></tr>\n<tr><td>List of Tables/Figures</td><td>All tables, graphs, frameworks, and diagrams listed.</td><td>\u2610</td></tr>\n<tr><td>Chapters 1\u20135</td><td>Complete, aligned, and proofread.</td><td>\u2610</td></tr>\n<tr><td>References</td><td>All cited sources included and formatted.</td><td>\u2610</td></tr>\n<tr><td>Appendices</td><td>Letters, instruments, validation, computations, screenshots included.</td><td>\u2610</td></tr>\n<tr><td>Curriculum Vitae</td><td>Researcher profile complete and formal.</td><td>\u2610</td></tr>\n</table>\n<div class=\"callout\"><b>Tutor Reminder:</b> The manuscript is not complete if it only has Chapters 1\u20135. Preliminary pages and back matter are also part of the final paper.</div>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Use this checklist before printing or submitting.</li><li>Check page numbers last.</li><li>Review adviser comments before final formatting.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not submit without references.</li><li>Do not forget appendices.</li><li>Do not leave placeholder names or dates.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Let learners tick each item during final checking.</li></ul></div>\n</div>\n", "notes": "Final checklist for preliminary and back matter."}, {"section": "Before Chapters", "title": "Quantitative vs Qualitative Across Chapters", "subtitle": "How each chapter changes depending on research type", "body": "\n<table>\n<tr><th>Chapter</th><th>Quantitative Research</th><th>Qualitative Research</th></tr>\n<tr><td>Chapter 1</td><td>Uses variables, measurable questions, and sometimes a hypothesis.</td><td>Uses central questions about experiences, perceptions, or meanings.</td></tr>\n<tr><td>Chapter 2</td><td>Reviews variables, indicators, statistical findings, and related theories.</td><td>Reviews concepts, lived experiences, context, and meaning-based theories.</td></tr>\n<tr><td>Chapter 3</td><td>Uses respondents, questionnaires, sampling, and statistical treatment.</td><td>Uses participants, interviews, observations, and thematic analysis.</td></tr>\n<tr><td>Chapter 4</td><td>Presents tables, graphs, means, percentages, and tests of significance.</td><td>Presents codes, categories, themes, and participant statements.</td></tr>\n<tr><td>Chapter 5</td><td>Conclusions are based on numerical findings.</td><td>Conclusions are based on themes and participant experiences.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Match the research type to the SOP.</li><li>Use numerical tools for numerical questions.</li><li>Use interviews for experience-based questions.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not use statistics if the study is purely qualitative.</li><li>Do not use only interview stories if the SOP asks for significant difference.</li><li>Do not mix methods unless the design is mixed-methods.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask learners to underline verbs: determine/measure/test = quantitative; explore/describe/understand = qualitative.</li></ul></div>\n</div>\n", "notes": "This is a comparison map for all chapters."}, {"section": "Before Chapters", "title": "Research Alignment Formula", "subtitle": "The most important rule before writing", "body": "\n<div class=\"diagram\">\n<div>Title</div><span>\u2192</span><div>SOP</div><span>\u2192</span><div>Objectives</div><span>\u2192</span><div>Method</div><span>\u2192</span><div>Findings</div><span>\u2192</span><div>Conclusions</div>\n</div>\n<p>A research paper becomes confusing when the title, questions, objectives, method, findings, and conclusions do not match. Every chapter must answer or support the Statement of the Problem.</p>\n<table>\n<tr><th>Weak Alignment</th><th>Improved Alignment</th></tr>\n<tr><td>Title is about usability, SOP asks about satisfaction only, methodology uses interviews, and Chapter 4 shows random comments.</td><td>Title is about usability, SOP asks usability level, methodology uses a Likert-scale questionnaire, and Chapter 4 shows mean scores per usability indicator.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Check alignment after writing every chapter.</li><li>Use the same indicators from Chapter 1 to Chapter 4.</li><li>Make recommendations based on findings.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not add findings that were not asked in the SOP.</li><li>Do not recommend actions that are not supported by findings.</li><li>Do not change variables halfway through the paper.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Use this formula as a defense answer when asked why the method was used.</li></ul></div>\n</div>\n", "notes": "Repeat the alignment formula often."}, {"section": "Chapter 1", "title": "Chapter 1: Overview", "subtitle": "All parts of Chapter 1", "body": "<table><tr><th>Part</th><th>Purpose</th></tr><tr><td>Introduction</td><td>The opening section that introduces the general topic and prepares the reader for the problem.</td></tr><tr><td>Background of the Study</td><td>Explains the situation, problem, gap, and reason for conducting the study.</td></tr><tr><td>Statement of the Problem</td><td>Lists the main and specific questions that the research must answer.</td></tr><tr><td>Objectives of the Study</td><td>Action statements that match the Statement of the Problem.</td></tr><tr><td>Hypothesis</td><td>A testable prediction used mainly in quantitative studies.</td></tr><tr><td>Significance of the Study</td><td>Explains who will benefit from the study and how they will benefit.</td></tr><tr><td>Scope and Delimitations</td><td>States what the study includes and intentionally excludes.</td></tr><tr><td>Limitations of the Study</td><td>Explains constraints that may affect the study.</td></tr><tr><td>Definition of Terms</td><td>Defines important terms as used in the study.</td></tr></table>\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>In Chapter 1, quantitative research focuses on measurable variables, respondents, numerical tools, and statistical findings.</td><td>In Chapter 1, qualitative research focuses on experiences, participants, meanings, context, and themes.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Teach the chapter parts in order.</li><li>Connect every part to the SOP.</li><li>Use the same topic in examples.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not jump to the full sample before explaining the parts.</li><li>Do not skip small parts like limitations or definitions.</li><li>Do not mix quantitative and qualitative logic incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>After all parts are taught, show the complete sample so learners see how the parts combine.</li></ul></div>\n</div>\n", "notes": "Teach all individual parts first, then the full sample at the end of Chapter 1."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Introduction", "subtitle": "The opening section that introduces the general topic and prepares the reader for the problem.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The opening section that introduces the general topic and prepares the reader for the problem.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Digital technologies are increasingly used in educational institutions to improve communication, scheduling, and academic support. In student-faculty consultation, digital systems can support clearer scheduling and better monitoring.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Introduces a measurable topic, such as usability level, effectiveness, satisfaction, or relationship between variables.</td><td>Introduces a phenomenon, experience, challenge, perception, or meaning that needs deeper understanding.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Background of the Study", "subtitle": "Explains the situation, problem, gap, and reason for conducting the study.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Explains the situation, problem, gap, and reason for conducting the study.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Academic consultation allows students to clarify lessons and requirements. However, informal scheduling may cause delayed replies, overlapping schedules, and unclear appointment status. This shows the need for a more organized consultation process.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Uses measurable problems, statistics, ratings, variables, or system performance gaps.</td><td>Uses observed situations, participant experiences, challenges, and context.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Statement of the Problem", "subtitle": "Lists the main and specific questions that the research must answer.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Lists the main and specific questions that the research must answer.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>This study aims to determine the level of usability of a web-based consultation system. Specifically, it asks about respondent profile, usability level, significant difference by user role, and proposed improvements.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Uses questions like: What is the level? Is there a significant difference? Is there a relationship?</td><td>Uses questions like: What are the experiences? What challenges are encountered? How do participants cope?</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Objectives of the Study", "subtitle": "Action statements that match the Statement of the Problem.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Action statements that match the Statement of the Problem.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>The study aims to identify respondent profile, determine usability level, test significant difference by user role, and propose improvements based on findings.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Uses verbs such as determine, measure, assess, compare, test, evaluate.</td><td>Uses verbs such as explore, describe, understand, examine, identify.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Hypothesis", "subtitle": "A testable prediction used mainly in quantitative studies.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>A testable prediction used mainly in quantitative studies.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>H0: There is no significant difference in usability assessment when respondents are grouped according to user role.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Usually used when testing relationship, difference, or effect.</td><td>Usually not used; qualitative studies use central questions or assumptions instead.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Significance of the Study", "subtitle": "Explains who will benefit from the study and how they will benefit.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Explains who will benefit from the study and how they will benefit.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Students may benefit from faster consultation booking. Faculty may benefit from organized schedule monitoring. Administrators may use the findings to improve support services.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Benefits often focus on measurable improvement and data-based decisions.</td><td>Benefits often focus on understanding experiences and improving support.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Scope and Delimitations", "subtitle": "States what the study includes and intentionally excludes.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>States what the study includes and intentionally excludes.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>This study focuses on usability assessment of a consultation system among selected students and faculty members. It does not include enrollment, grading, or payment features.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Defines variables, respondents, locale, timeframe, and statistical coverage.</td><td>Defines participants, phenomenon, locale, timeframe, and context.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Limitations of the Study", "subtitle": "Explains constraints that may affect the study.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Explains constraints that may affect the study.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>The study may be limited by the number of available respondents, testing period, and specific school setting.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>May include sample size, response rate, testing period, and instrument limits.</td><td>May include participant honesty, interview time, and researcher interpretation.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1 Part: Definition of Terms", "subtitle": "Defines important terms as used in the study.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Defines important terms as used in the study.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Usability refers to the ease, efficiency, learnability, and satisfaction experienced by users when operating the system.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Defines variables and indicators in measurable terms.</td><td>Defines concepts based on context and participant meaning.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 1 sample will appear after all part lessons."}, {"section": "Chapter 1", "title": "Chapter 1: Complete Full Sample at the End", "subtitle": "Full sample shown after all Chapter 1 parts", "body": "\n<div class=\"sampleText fullSample\">\n<h3>CHAPTER 1<br>THE PROBLEM AND ITS BACKGROUND</h3>\n<h3>Introduction</h3>\n<p>Digital systems are increasingly used in educational institutions to improve communication, scheduling, and academic support services. These systems help organize processes that were previously handled manually or through informal communication channels. In the academic setting, one process that can benefit from digital support is student-faculty consultation.</p>\n<h3>Background of the Study</h3>\n<p>Academic consultation is an important activity because it allows students to ask questions, clarify requirements, and receive guidance from faculty members. However, consultation requests are often arranged through informal messages, which may result in delayed replies, overlapping schedules, and unclear appointment status. These issues may affect the efficiency of student-faculty communication and may reduce students\u2019 ability to receive timely academic support.</p>\n<p>To address this concern, the present study focuses on the usability of a web-based consultation system that can organize booking, notification, and consultation records. A system may contain useful features, but it must still be evaluated to determine whether users can operate it easily, efficiently, and satisfactorily.</p>\n<h3>Statement of the Problem</h3>\n<p>This study aims to determine the level of usability of the developed web-based consultation system among college students and faculty members. Specifically, it seeks to answer the following questions:</p>\n<ol><li>What is the profile of the respondents in terms of user role and year level?</li><li>What is the level of usability of the system in terms of efficiency, effectiveness, learnability, and satisfaction?</li><li>Is there a significant difference in usability assessment when grouped according to user role?</li><li>What improvements may be proposed based on the findings?</li></ol>\n<h3>Objectives of the Study</h3>\n<p>The general objective of this study is to determine the level of usability of the developed consultation system. Specifically, it aims to identify the profile of respondents, determine the usability level of the system, test if there is a significant difference by user role, and propose improvements based on the findings.</p>\n<h3>Hypothesis</h3><p>H\u2080: There is no significant difference in the usability assessment of the system when respondents are grouped according to user role.</p>\n<h3>Significance of the Study</h3>\n<p>Students may benefit through faster and clearer consultation booking. Faculty members may benefit through organized schedule monitoring and consultation record access. School administrators may use the findings as basis for improving academic support services. Future researchers may use the study as reference for related studies on consultation systems, usability, and academic support.</p>\n<h3>Scope and Delimitations</h3>\n<p>This study focuses on the usability assessment of a web-based consultation system among selected students and faculty members of ABC College during academic year 2026. The system covers consultation booking, schedule viewing, notifications, and consultation record monitoring. It does not include enrollment, grading, payment, or full learning management features.</p>\n<h3>Limitations of the Study</h3><p>The study may be limited by the number of respondents available during the testing period. The findings may not fully represent all students and faculty members from other institutions. The evaluation is also limited to usability and does not measure long-term academic performance.</p>\n<h3>Definition of Terms</h3><p><b>Consultation System</b> refers to the web-based platform used for booking and monitoring student-faculty consultations. <b>Usability</b> refers to the ease, efficiency, learnability, and satisfaction experienced by users while operating the system. <b>Respondents</b> refer to students and faculty members who evaluated the system.</p>\n</div>\n", "notes": "This sample appears after all individual lessons for Chapter 1."}, {"section": "Chapter 2", "title": "Chapter 2: Overview", "subtitle": "All parts of Chapter 2", "body": "<table><tr><th>Part</th><th>Purpose</th></tr><tr><td>Introduction to Chapter 2</td><td>Introduces the literature, studies, theories, and framework to be reviewed.</td></tr><tr><td>Related Literature</td><td>Discusses concepts, definitions, and explanations from credible sources.</td></tr><tr><td>Related Studies</td><td>Discusses previous research works related to the study.</td></tr><tr><td>Foreign and Local Sources</td><td>Shows international and Philippine relevance.</td></tr><tr><td>Theoretical Framework</td><td>Presents the theory that supports the study.</td></tr><tr><td>Conceptual Framework</td><td>Shows the researcher\u2019s own model of the study.</td></tr><tr><td>Synthesis</td><td>Connects and compares reviewed sources.</td></tr><tr><td>Research Gap</td><td>States the missing or limited part in previous studies.</td></tr></table>\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>In Chapter 2, quantitative research focuses on measurable variables, respondents, numerical tools, and statistical findings.</td><td>In Chapter 2, qualitative research focuses on experiences, participants, meanings, context, and themes.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Teach the chapter parts in order.</li><li>Connect every part to the SOP.</li><li>Use the same topic in examples.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not jump to the full sample before explaining the parts.</li><li>Do not skip small parts like limitations or definitions.</li><li>Do not mix quantitative and qualitative logic incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>After all parts are taught, show the complete sample so learners see how the parts combine.</li></ul></div>\n</div>\n", "notes": "Teach all individual parts first, then the full sample at the end of Chapter 2."}, {"section": "Chapter 2", "title": "Chapter 2 Part: Introduction to Chapter 2", "subtitle": "Introduces the literature, studies, theories, and framework to be reviewed.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Introduces the literature, studies, theories, and framework to be reviewed.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>This chapter reviews literature and studies related to academic consultation, appointment scheduling, usability, student support, and technology acceptance.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Introduces variables, indicators, and measurable concepts to be reviewed.</td><td>Introduces experiences, meanings, social context, and participant-related concepts.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant,
