ut\">User Acceptance and Usability Assessment</div>\n</div>\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Presents the theory that supports the study.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>The Technology Acceptance Model explains how perceived usefulness and perceived ease of use influence user acceptance of technology.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Theory explains variable relationships or user acceptance.</td><td>Theory guides interpretation of experiences or meanings.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 2 sample will appear after all part lessons."}, {"section": "Chapter 2", "title": "Chapter 2 Part: Conceptual Framework", "subtitle": "Shows the researcher\u2019s own model of the study.", "body": "\n\n<div class=\"ipoAdvanced\">\n  <div class=\"ipoCol input\"><h3>INPUT</h3><ul><li>Consultation problems</li><li>User needs</li><li>System requirements</li></ul></div>\n  <div class=\"bigArrow\">\u2192</div>\n  <div class=\"ipoCol process\"><h3>PROCESS</h3><ul><li>Analysis</li><li>Design</li><li>Development</li><li>Evaluation</li></ul></div>\n  <div class=\"bigArrow\">\u2192</div>\n  <div class=\"ipoCol output\"><h3>OUTPUT</h3><ul><li>Usability results</li><li>Proposed improvements</li><li>Enhanced system</li></ul></div>\n</div>\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Shows the researcher\u2019s own model of the study.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Input includes student needs and consultation problems. Process includes system development, data gathering, and evaluation. Output includes usability findings and proposed improvements.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Often shows independent/dependent variables or IPO.</td><td>Often shows concepts, process, or experience flow.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 2 sample will appear after all part lessons."}, {"section": "Chapter 2", "title": "Chapter 2 Part: Synthesis", "subtitle": "Connects and compares reviewed sources.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Connects and compares reviewed sources.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Reviewed sources agree that digital scheduling can improve convenience and organization, but many studies focus on general appointment systems rather than student-faculty consultation.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Synthesizes patterns in statistical findings.</td><td>Synthesizes patterns in themes and experiences.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 2 sample will appear after all part lessons."}, {"section": "Chapter 2", "title": "Chapter 2 Part: Research Gap", "subtitle": "States the missing or limited part in previous studies.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>States the missing or limited part in previous studies.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>There is limited research focusing on the usability of web-based consultation systems in a local college setting.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Gap may involve variable, locale, sample, or statistical focus.</td><td>Gap may involve unexplored experiences, participants, or context.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 2 sample will appear after all part lessons."}, {"section": "Chapter 2", "title": "Chapter 2: Complete Full Sample at the End", "subtitle": "Full sample shown after all Chapter 2 parts", "body": "\n<div class=\"sampleText fullSample\">\n<h3>CHAPTER 2<br>REVIEW OF RELATED LITERATURE AND STUDIES</h3>\n<h3>Introduction</h3>\n<p>This chapter reviews literature and studies related to digital consultation systems, appointment scheduling, usability evaluation, and technology acceptance. It explains the concepts and previous findings that support the present study.</p>\n<h3>Related Literature</h3>\n<p>Digital systems are used to improve communication, scheduling, and record management in organizations. In schools, these systems can help students and faculty members manage academic transactions more efficiently. Academic consultation is one of the services that may benefit from digital support because it requires clear communication and proper schedule coordination.</p>\n<p>Usability is an important factor in system evaluation. A system may provide useful features, but if users find it difficult to understand or operate, the system may not be effective in actual use. Usability commonly includes efficiency, effectiveness, learnability, and satisfaction.</p>\n<h3>Related Studies</h3>\n<p>Previous studies on online appointment systems show that digital scheduling can improve access, reduce waiting uncertainty, and organize service transactions. Studies on school information systems also show that digital platforms can improve service delivery when they are easy to use and accessible to users.</p>\n<h3>Theoretical Framework</h3>\n<div class=\"frameworkDiagram smallDiagram\"><div class=\"theoryBox main\">Technology Acceptance Model</div><div class=\"branchRow\"><div class=\"theoryBox\">Perceived Usefulness</div><div class=\"theoryBox\">Perceived Ease of Use</div></div><div class=\"arrowDown\">\u2193</div><div class=\"theoryBox output\">User Acceptance and Usability Assessment</div></div>\n<p>This study is anchored on the Technology Acceptance Model. The theory explains that users are more likely to accept a technology when they find it useful and easy to use. In this study, the theory supports the evaluation of the consultation system because students and faculty members assess whether the system helps them complete consultation-related tasks and whether it is easy to operate.</p>\n<h3>Conceptual Framework</h3>\n<div class=\"ipoAdvanced compact\"><div class=\"ipoCol input\"><h3>INPUT</h3><p>Consultation problems, user needs, system requirements, related studies</p></div><div class=\"bigArrow\">\u2192</div><div class=\"ipoCol process\"><h3>PROCESS</h3><p>Analysis, design, development, testing, usability evaluation</p></div><div class=\"bigArrow\">\u2192</div><div class=\"ipoCol output\"><h3>OUTPUT</h3><p>Usability results, proposed improvements, enhanced system</p></div></div>\n<p>The conceptual framework follows the Input\u2013Process\u2013Output model. The input includes existing consultation problems, student and faculty needs, system requirements, and related studies. The process includes system analysis, interface design, database planning, development, testing, and evaluation. The output includes usability results and proposed improvements.</p>\n<h3>Synthesis</h3>\n<p>The reviewed literature and studies show that digital systems can improve convenience, access, and organization. They also emphasize the importance of usability in technology adoption. However, most studies focus on general appointment systems and broad school information systems, while fewer studies focus specifically on student-faculty consultation systems in a local college setting.</p>\n<h3>Research Gap</h3><p>The gap addressed by this study is the limited local evaluation of web-based consultation systems for student-faculty interaction. This study contributes by assessing usability and identifying improvements for a consultation system designed for academic support.</p>\n</div>\n", "notes": "This sample appears after all individual lessons for Chapter 2."}, {"section": "Chapter 3", "title": "Chapter 3: Overview", "subtitle": "All parts of Chapter 3", "body": "<table><tr><th>Part</th><th>Purpose</th></tr><tr><td>Research Design</td><td>The overall plan used to answer the research questions.</td></tr><tr><td>Research Locale</td><td>The place where the study will be conducted.</td></tr><tr><td>Respondents or Participants</td><td>The people who provide data.</td></tr><tr><td>Sampling Technique</td><td>The method used to select respondents or participants.</td></tr><tr><td>Research Instrument</td><td>The tool used to collect data.</td></tr><tr><td>Validation of Instrument</td><td>The process of checking whether the instrument is clear and appropriate.</td></tr><tr><td>Data Gathering Procedure</td><td>The step-by-step process of collecting data.</td></tr><tr><td>Ethical Considerations</td><td>Rules that protect respondents or participants.</td></tr><tr><td>Data Analysis</td><td>The method used to process and interpret data.</td></tr></table>\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>In Chapter 3, quantitative research focuses on measurable variables, respondents, numerical tools, and statistical findings.</td><td>In Chapter 3, qualitative research focuses on experiences, participants, meanings, context, and themes.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Teach the chapter parts in order.</li><li>Connect every part to the SOP.</li><li>Use the same topic in examples.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not jump to the full sample before explaining the parts.</li><li>Do not skip small parts like limitations or definitions.</li><li>Do not mix quantitative and qualitative logic incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>After all parts are taught, show the complete sample so learners see how the parts combine.</li></ul></div>\n</div>\n", "notes": "Teach all individual parts first, then the full sample at the end of Chapter 3."}, {"section": "Chapter 3", "title": "Chapter 3 Part: Research Design", "subtitle": "The overall plan used to answer the research questions.", "body": "\n<div class=\"diagram\"><div>Plan</div><span>\u2192</span><div>Collect Data</div><span>\u2192</span><div>Analyze</div><span>\u2192</span><div>Interpret</div></div>\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The overall plan used to answer the research questions.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>For a quantitative system evaluation, descriptive quantitative design measures usability using numerical ratings. For qualitative student experience, phenomenology explores lived experiences.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Descriptive, correlational, comparative, experimental, or developmental design.</td><td>Phenomenology, case study, narrative inquiry, ethnography, or grounded theory.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 3 sample will appear after all part lessons."}, {"section": "Chapter 3", "title": "Chapter 3 Part: Research Locale", "subtitle": "The place where the study will be conducted.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The place where the study will be conducted.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>The study will be conducted at ABC College, where students regularly request academic consultation and faculty members provide academic guidance.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Locale where respondents are surveyed or system is tested.</td><td>Setting where participants experience the phenomenon.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 3 sample will appear after all part lessons."}, {"section": "Chapter 3", "title": "Chapter 3 Part: Respondents or Participants", "subtitle": "The people who provide data.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The people who provide data.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Quantitative respondents may include 120 students and 20 faculty members. Qualitative participants may include 10 students who experienced requesting academic consultation.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Uses respondents, usually larger in number.</td><td>Uses participants, usually smaller but deeper in detail.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><l the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 3 sample will appear after all part lessons."}, {"section": "Chapter 3", "title": "Chapter 3 Part: Research Instrument", "subtitle": "The tool used to collect data.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The tool used to collect data.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>A quantitative study may use a validated Likert-scale questionnaire. A qualitative study may use a semi-structured interview guide with open-ended questions.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Questionnaire, test, rating scale, checklist.</td><td>Interview guide, observation guide, field notes.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 3 sample will appear after all part lessons."}, {"section": "Chapter 3", "title": "Chapter 3 Part: Validation of Instrument", "subtitle": "The process of checking whether the instrument is clear and appropriate.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The process of checking whether the instrument is clear and appropriate.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>The questionnaire or interview guide may be reviewed by three experts who check clarity, relevance, grammar, and SOP alignment.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>May include expert validation, pilot testing, reliability testing.</td><td>May include expert review, pilot interview, member checking.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 3 sample will appear after all part lessons."}, {"section": "Chapter 3", "title": "Chapter 3 Part: Data Gathering Procedure", "subtitle": "The step-by-step process of collecting data.", "body": "\n<div class=\"diagram\"><div>Plan</div><span>\u2192</span><div>Collect Data</div><span>\u2192</span><div>Analyze</div><span>\u2192</span><div>Interpret</div></div>\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The step-by-step process of collecting data.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>The researchers request permission, orient the respondents or participants, secure consent, distribute the questionnaire or conduct interviews, collect responses, and prepare data for analysis.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Survey distribution, retrieval, encoding.</td><td>Interview scheduling, recording, transcription.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 3 sample will appear after all part lessons."}, {"section": "Chapter 3", "title": "Chapter 3 Part: Ethical Considerations", "subtitle": "Rules that protect respondents or participants.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Rules that protect respondents or participants.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Participation must be voluntary. Identities and responses must be kept confidential. Participants may withdraw anytime. Data must be used only for academic purposes.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Protects survey responses and personal data.</td><td>Protects identities, recordings, and sensitive narratives.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 3 sample will appear after all part lessons."}, {"section": "Chapter 3", "title": "Chapter 3 Part: Data Analysis", "subtitle": "The method used to process and interpret data.", "body": "\n<div class=\"diagram\"><div>Plan</div><span>\u2192</span><div>Collect Data</div><span>\u2192</span><div>Analyze</div><span>\u2192</span><div>Interpret</div></div>\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>The method used to process and interpret data.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Quantitative data may use frequency, percentage, weighted mean, standard deviation, and t-test. Qualitative data may use thematic analysis.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Uses statistical tools.</td><td>Uses coding, categories, and themes.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 3 sample will appear after all part lessons."}, {"section": "Chapter 3", "title": "Chapter 3: Complete Full Sample at the End", "subtitle": "Full sample shown after all Chapter 3 parts", "body": "\n<div class=\"sampleText fullSample\">\n<h3>CHAPTER 3<br>RESEARCH METHODOLOGY</h3>\n<h3>Research Design</h3><p>This study uses a descriptive quantitative research design. This design is appropriate because the study aims to determine the level of usability of the developed web-based consultation system based on the assessment of users. Quantitative design is used because the data are gathered through numerical ratings.</p>\n<h3>Research Locale</h3><p>The study will be conducted at ABC College, where students and faculty members regularly conduct academic consultations. The locale is suitable because the respondents are familiar with the consultation process and can provide meaningful feedback on the developed system.</p>\n<h3>Respondents of the Study</h3><p>The respondents will be selected students and faculty members who have tested the consultation system. They are chosen because they can provide direct feedback about system usability.</p>\n<h3>Sampling Technique</h3><p>Purposive sampling will be used. This is appropriate because only users who have experienced using the system can properly assess its usability.</p>\n<h3>Research Instrument</h3><p>The study will use a researcher-made questionnaire divided into two parts. The first part will gather respondent profile, while the second part will assess the system in terms of efficiency, effectiveness, learnability, and satisfaction using a five-point Likert scale.</p>\n<table><tr><th>Scale</th><th>Range</th><th>Interpretation</th></tr><tr><td>5</td><td>4.21\u20135.00</td><td>Strongly Agree</td></tr><tr><td>4</td><td>3.41\u20134.20</td><td>Agree</td></tr><tr><td>3</td><td>2.61\u20133.40</td><td>Neutral</td></tr><tr><td>2</td><td>1.81\u20132.60</td><td>Disagree</td></tr><tr><td>1</td><td>1.00\u20131.80</td><td>Strongly Disagree</td></tr></table>\n<h3>Validation of Instrument</h3><p>The questionnaire will be reviewed by experts in research and information technology. They will check clarity, relevance, organization, and alignment with the research questions. Revisions will be made based on their comments before final distribution.</p>\n<h3>Data Gathering Procedure</h3><div class=\"diagram\"><div>Permission</div><span>\u2192</span><div>Orientation</div><span>\u2192</span><div>Survey</div><span>\u2192</span><div>Encoding</div><span>\u2192</span><div>Analysis</div></div><p>The researchers will request permission from the school. After approval, respondents will be oriented about the purpose of the study. The questionnaire will be distributed to respondents who tested the system. The collected responses will be encoded and prepared for statistical analysis.</p>\n<h3>Ethical Considerations</h3><p>The respondents will be informed about the purpose of the study. Participation will be voluntary, and respondents may withdraw at any time. Their responses will be kept confidential and used only for academic research.</p>\n<h3>Statistical Treatment</h3><table><tr><th>Research Question</th><th>Data Needed</th><th>Statistical Tool</th></tr><tr><td>Profile of respondents</td><td>User role and year level</td><td>Frequency and percentage</td></tr><tr><td>Level of usability</td><td>Likert-scale ratings</td><td>Weighted mean and standard deviation</td></tr><tr><td>Significant difference</td><td>Grouped mean scores</td><td>t-test</td></tr><tr><td>Proposed improvements</td><td>Lowest indicators and comments</td><td>Descriptive interpretation</td></tr></table>\n</div>\n", "notes": "This sample appears after all individual lessons for Chapter 3."}, {"section": "Chapter 4", "title": "Chapter 4: Overview", "subtitle": "All parts of Chapter 4", "body": "<table><tr><th>Part</th><th>Purpose</th></tr><tr><td>Introduction to Chapter 4</td><td>Opens the chapter and explains how results are arranged.</td></tr><tr><td>Profile of Respondents / Participants</td><td>Describes the people who provided data.</td></tr><tr><td>Presentation of Data</td><td>Shows the findings through tables, graphs, or themes.</td></tr><tr><td>Analysis of Data</td><td>Explains patterns in the results.</td></tr><tr><td>Interpretation of Data</td><td>Explains what the findings mean.</td></tr><tr><td>Discussion of Findings</td><td>Connects findings to literature and research gap.</td></tr></table>\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>In Chapter 4, quantitative research focuses on measurable variables, respondents, numerical tools, and statistical findings.</td><td>In Chapter 4, qualitative research focuses on experiences, participants, meanings, context, and themes.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Teach the chapter parts in order.</li><li>Connect every part to the SOP.</li><li>Use the same topic in examples.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not jump to the full sample before explaining the parts.</li><li>Do not skip small parts like limitations or definitions.</li><li>Do not mix quantitative and qualitative logic incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>After all parts are taught, show the complete sample so learners see how the parts combine.</li></ul></div>\n</div>\n", "notes": "Teach all individual parts first, then the full sample at the end of Chapter 4."}, {"section": "Chapter 4", "title": "Chapter 4 Part: Introduction to Chapter 4", "subtitle": "Opens the chapter and explains how results are arranged.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Opens the chapter and explains how results are arranged.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>This chapter presents the findings based on the order of the research questions. Each table, graph, or theme is followed by analysis and interpretation.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Introduces statistical results, tables, graphs, and hypothesis testing.</td><td>Introduces themes, categories, and participant statements.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 4 sample will appear after all part lessons."}, {"section": "Chapter 4", "title": "Chapter 4 Part: Profile of Respondents / Participants", "subtitle": "Describes the people who provided data.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Describes the people who provided data.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>A quantitative profile may show 120 respondents are students and 20 are faculty members. A qualitative profile may use participant codes such as P1 to P10 to protect identity.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Uses frequency and percentage tables.</td><td>Uses coded participant profiles and descriptions.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 4 sample will appear after all part lessons."}, {"section": "Chapter 4", "title": "Chapter 4 Part: Presentation of Data", "subtitle": "Shows the findings through tables, graphs, or themes.", "body": "\n<div class=\"diagram\"><div>Table / Theme</div><span>\u2192</span><div>Pattern</div><span>\u2192</span><div>Meaning</div><span>\u2192</span><div>Decision</div></div>\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Shows the findings through tables, graphs, or themes.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>A usability study may present mean scores for efficiency, effectiveness, learnability, and satisfaction. A qualitative study may present codes, themes, and meanings.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Statistical tables and graphs.</td><td>Thematic tables and participant excerpts.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 4 sample will appear after all part lessons."}, {"section": "Chapter 4", "title": "Chapter 4 Part: Analysis of Data", "subtitle": "Explains patterns in the results.", "body": "\n<div class=\"diagram\"><div>Table / Theme</div><span>\u2192</span><div>Pattern</div><span>\u2192</span><div>Meaning</div><span>\u2192</span><div>Decision</div></div>\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Explains patterns in the results.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>If learnability has the highest mean, the analysis explains that users found the system easy to understand. If delayed replies appear repeatedly in interviews, the analysis identifies it as a major code.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Explains high/low scores, ranks, p-values, and relationships.</td><td>Explains repeated ideas, patterns, codes, and categories.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 4 sample will appear after all part lessons."}, {"section": "Chapter 4", "title": "Chapter 4 Part: Interpretation of Data", "subtitle": "Explains what the findings mean.", "body": "\n<div class=\"diagram\"><div>Table / Theme</div><span>\u2192</span><div>Pattern</div><span>\u2192</span><div>Meaning</div><span>\u2192</span><div>Decision</div></div>\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Explains what the findings mean.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>A high mean score implies that the system is usable. A theme about communication barriers implies that students need clearer consultation channels.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Interprets based on scales and statistical decisions.</td><td>Interprets based on participant meaning and context.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 4 sample will appear after all part lessons."}, {"section": "Chapter 4", "title": "Chapter 4 Part: Discussion of Findings", "subtitle": "Connects findings to literature and research gap.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Connects findings to literature and research gap.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>If results show that digital scheduling improves organization, this may support previous studies about online appointment systems. The discussion also explains how the current findings address the gap.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Compares numerical findings with previous studies.</td><td>Compares themes with related literature and experiences.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 4 sample will appear after all part lessons."}, {"section": "Chapter 4", "title": "Chapter 4: Complete Full Sample at the End", "subtitle": "Full sample shown after all Chapter 4 parts", "body": "\n<div class=\"sampleText fullSample\">\n<h3>CHAPTER 4<br>PRESENTATION, ANALYSIS, AND INTERPRETATION OF DATA</h3>\n<h3>Introduction</h3><p>This chapter presents, analyzes, and interprets the data gathered from the respondents. The presentation follows the order of the specific problems stated in Chapter 1.</p>\n<h3>Profile of Respondents</h3><table><tr><th>User Role</th><th>Frequency</th><th>Percentage</th></tr><tr><td>Students</td><td>120</td><td>85.71%</td></tr><tr><td>Faculty Members</td><td>20</td><td>14.29%</td></tr><tr><td>Total</td><td>140</td><td>100%</td></tr></table><p>The table shows that most respondents were students. This indicates that the system was assessed mainly by the group that commonly requests academic consultation.</p>\n<h3>Usability Assessment</h3><div class=\"chart\"><div style=\"height:80%;width:22%;background:#60a5fa\"><span>4.48</span></div><div style=\"height:76%;width:22%;background:#34d399\"><span>4.42</span></div><div style=\"height:86%;width:22%;background:#fbbf24\"><span>4.55</span></div><div style=\"height:68%;width:22%;background:#a78bfa\"><span>4.31</span></div></div>\n<table><tr><th>Indicator</th><th>Mean</th><th>SD</th><th>Interpretation</th><th>Rank</th></tr><tr><td>Efficiency</td><td>4.48</td><td>0.51</td><td>Strongly Agree</td><td>2</td></tr><tr><td>Effectiveness</td><td>4.42</td><td>0.56</td><td>Strongly Agree</td><td>3</td></tr><tr><td>Learnability</td><td>4.55</td><td>0.47</td><td>Strongly Agree</td><td>1</td></tr><tr><td>Satisfaction</td><td>4.31</td><td>0.62</td><td>Strongly Agree</td><td>4</td></tr><tr><td><b>Grand Mean</b></td><td><b>4.44</b></td><td><b>0.54</b></td><td><b>Strongly Agree</b></td><td></td></tr></table>\n<h3>Analysis and Interpretation</h3><p>The system obtained a grand mean of 4.44, interpreted as Strongly Agree. This means that the respondents found the system usable in terms of efficiency, effectiveness, learnability, and satisfaction. Learnability received the highest mean, which indicates that users found the system easy to understand and operate. Satisfaction received the lowest mean, but it was still interpreted positively, showing that the system is acceptable but still open for improvement.</p>\n<h3>Significant Difference</h3><table><tr><th>Group</th><th>Mean</th><th>t-value</th><th>p-value</th><th>Decision</th></tr><tr><td>Students</td><td>4.43</td><td>0.62</td><td>0.536</td><td>Not Significant</td></tr><tr><td>Faculty Members</td><td>4.47</td><td></td><td></td><td></td></tr></table><p>The p-value of 0.536 is greater than the 0.05 level of significance. Therefore, the null hypothesis is not rejected. This means that students and faculty members did not significantly differ in their usability assessment of the system.</p>\n<h3>Discussion</h3><p>The findings suggest that a web-based consultation system can support academic services by making consultation scheduling more organized and accessible. The result supports previous studies indicating that digital scheduling systems can improve service efficiency and user convenience.</p>\n</div>\n", "notes": "This sample appears after all individual lessons for Chapter 4."}, {"section": "Chapter 5", "title": "Chapter 5: Overview", "subtitle": "All parts of Chapter 5", "body": "<table><tr><th>Part</th><th>Purpose</th></tr><tr><td>Summary of the Study</td><td>Briefly restates purpose, method, respondents or participants, instrument, and analysis.</td></tr><tr><td>Summary of Findings</td><td>Lists the major results in SOP order.</td></tr><tr><td>Conclusions</td><td>Final statements based on findings.</td></tr><tr><td>Recommendations</td><td>Suggested actions based on conclusions.</td></tr><tr><td>Action Plan</td><td>A practical table showing how recommendations may be applied.</td></tr></table>\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>In Chapter 5, quantitative research focuses on measurable variables, respondents, numerical tools, and statistical findings.</td><td>In Chapter 5, qualitative research focuses on experiences, participants, meanings, context, and themes.</td></tr>\n</table>\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Teach the chapter parts in order.</li><li>Connect every part to the SOP.</li><li>Use the same topic in examples.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not jump to the full sample before explaining the parts.</li><li>Do not skip small parts like limitations or definitions.</li><li>Do not mix quantitative and qualitative logic incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>After all parts are taught, show the complete sample so learners see how the parts combine.</li></ul></div>\n</div>\n", "notes": "Teach all individua ss=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Lists the major results in SOP order.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>The system obtained a grand mean of 4.44, interpreted as Strongly Agree. There was no significant difference in assessment between students and faculty members.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Presents means, percentages, p-values, or ranks.</td><td>Presents themes and major participant insights.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 5 sample will appear after all part lessons."}, {"section": "Chapter 5", "title": "Chapter 5 Part: Conclusions", "subtitle": "Final statements based on findings.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Final statements based on findings.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>The web-based consultation system is highly usable and acceptable. It can support academic consultation by improving schedule visibility.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Concludes based on numerical findings.</td><td>Concludes based on themes and meanings.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 5 sample will appear after all part lessons."}, {"section": "Chapter 5", "title": "Chapter 5 Part: Recommendations", "subtitle": "Suggested actions based on conclusions.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>Suggested actions based on conclusions.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Developers may improve notification visibility and calendar integration. Schools may adopt clearer consultation procedures.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Recommends improvements based on low-rated indicators or significant findings.</td><td>Recommends support, policy, or deeper future study based on themes.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 5 sample will appear after all part lessons."}, {"section": "Chapter 5", "title": "Chapter 5 Part: Action Plan", "subtitle": "A practical table showing how recommendations may be applied.", "body": "\n\n<div class=\"grid2\">\n<div class=\"panel\"><h3>Definition</h3><p>A practical table showing how recommendations may be applied.</p></div>\n<div class=\"panel\"><h3>Clear Example</h3><p>Objective: Improve notification feature. Activity: Add real-time alerts. Responsible person: Developers. Timeframe: one month.</p></div>\n</div>\n\n<table class=\"compareTable\">\n<tr><th>Quantitative Version</th><th>Qualitative Version</th></tr>\n<tr><td>Uses measurable targets and responsible persons.</td><td>Uses support-oriented actions based on participant needs.</td></tr>\n</table>\n\n\n<div class=\"triple\">\n  <div class=\"panel good\"><h3>Do's</h3><ul><li>Write this part based on the SOP.</li><li>Use specific terms from the study.</li><li>Explain why this part matters.</li><li>Keep the example connected to the title.</li></ul></div>\n  <div class=\"panel bad\"><h3>Don'ts</h3><ul><li>Do not write generic statements only.</li><li>Do not add information unrelated to the research problem.</li><li>Do not copy a template without adjusting it.</li><li>Do not mix quantitative and qualitative wording incorrectly.</li></ul></div>\n  <div class=\"panel tip\"><h3>Tutor Tips</h3><ul><li>Ask the learner to identify the evidence, variable, participant, or data source connected to this part.</li><li>Let the learner rewrite the sample using their own research topic.</li></ul></div>\n</div>\n\n", "notes": "This is an individual part lesson. The complete Chapter 5 sample will appear after all part lessons."}, {"section": "Chapter 5", "title": "Chapter 5: Complete Full Sample at the End", "subtitle": "Full sample shown after all Chapter 5 parts", "body": "\n<div class=\"sampleText fullSample\">\n<h3>CHAPTER 5<br>SUMMARY, CONCLUSIONS, AND RECOMMENDATIONS</h3>\n<h3>Summary of the Study</h3><p>This study determined the level of usability of a web-based consultation system among selected students and faculty members of ABC College. The study used a descriptive quantitative research design. Data were gathered using a validated questionnaire and analyzed using frequency, percentage, weighted mean, standard deviation, and t-test.</p>\n<h3>Summary of Findings</h3><p>The majority of respondents were students. The system obtained a grand mean of 4.44, interpreted as Strongly Agree. Among the usability indicators, learnability obtained the highest mean, while satisfaction obtained the lowest but was still interpreted as Strongly Agree. The test of difference showed no significant difference in assessment between students and faculty members.</p>\n<h3>Conclusions</h3><p>Based on the findings, the developed web-based consultation system is highly usable and acceptable to students and faculty members. The system can support academic consultation by improving booking, access, and record monitoring. Since there was no significant difference in assessment between students and faculty members, both user groups generally shared a positive view of the system.</p>\n<h3>Recommendations</h3><p>The school may consider further testing the system with more users before full implementation. Future developers may improve the notification feature, add calendar integration, strengthen mobile responsiveness, and enhance reporting tools. Future researchers may conduct similar studies using a larger sample, mixed-method approach, or different academic setting.</p>\n<h3>Action Plan</h3><table><tr><th>Objective</th><th>Activity</th><th>Responsible</th><th>Timeframe</th><th>Expected Output</th></tr><tr><td>Improve notification feature</td><td>Add real-time alerts</td><td>Developers</td><td>1 month</td><td>Improved notification visibility</td></tr><tr><td>Expand system testing</td><td>Conduct wider user evaluation</td><td>Researchers</td><td>2 months</td><td>More reliable usability results</td></tr><tr><td>Improve scheduling clarity</td><td>Add calendar integration</td><td>Developers</td><td>1 month</td><td>Clearer schedule monitoring</td></tr></table>\n</div>\n", "notes": "This sample appears after all individual lessons for Chapter 5."}, {"section": "PDF Examples", "title": "Complete Research PDFs", "subtitle": "Full examples are available as A4 PDF files", "body": "\n<div class=\"grid2\">\n<div class=\"pdfCard\"><h3>Full Quantitative Research PDF</h3><p>A4, Arial-compatible 12 pt, margins, front matter, complete Chapters 1-5, references, appendices, CV.</p><a href=\"full_quantitative_research_example_COMPLETE_A4_Arial12.pdf\" target=\"_blank\">Open Quantitative PDF</a></div>\n<div class=\"pdfCard\"><h3>Full Qualitative Research PDF</h3><p>A4, Arial-compatible 12 pt, margins, front matter, complete Chapters 1-5, references, appendices, CV.</p><a href=\"full_qualitative_research_example_COMPLETE_A4_Arial12.pdf\" target=\"_blank\">Open Qualitative PDF</a></div>\n</div>\n<iframe src=\"full_quantitative_research_example_COMPLETE_A4_Arial12.pdf\"></iframe>\n", "notes": "Use the PDF examples to show learners a manuscript layout."}];let index=0;const toc=document.getElementById('toc');slides.forEach((s,i)=>{let b=document.createElement('button');b.className='tocBtn';b.inne function go(i){index=Math.max(0,Math.min(i,slides.length-1));render();closeMenu();}function next(){go(index+1)}function prev(){go(index-1)}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')next();if(e.key==='ArrowLeft'||e.key==='PageUp')prev();});search.addEventListener('input',function(){let q=this.value.toLowerCase().trim();if(!q)return;let f=slides.findIndex(s=>(s.title+' '+s.subtitle+' '+s.body+' '+s.section).toLowerCase().includes(q));if(f>=0)go(f);});render();
